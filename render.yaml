# Render Blueprint — one free web service that serves both the API and the web app.
services:
  - type: web
    name: academy-concierge
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: CHAT_MODEL
        value: gemini-flash-latest
      - key: LLM_API_KEY
        sync: false # Google AI Studio key — entered in Render, never committed
      - key: ADMIN_KEY
        generateValue: true
      - key: DB_PATH
        value: /tmp/academy.db
